minimum_pre_commit_version: "4.3.0"

exclude: |
  (?x)^(
    config/|
    .venv/|
    dist/|
    build/|
    .*/migrations/|
    .*/node_modules/
  )

repos:
  # Ruff → linter + formatter (includes flake8-bandit / S rules from pyproject)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Mypy → type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --group dev mypy
        language: system
        types: [python]
        files: ^(custom_components/|tests/)
        pass_filenames: false

  # Secrets scanning with Gitleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (protect staged)
        entry: gitleaks protect --staged --redact
        language: golang
        pass_filenames: false

  # Useful generic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^(.devcontainer/devcontainer\.json|.*\.yaml\.j2)$
      - id: check-json
        exclude: ^(.devcontainer/devcontainer\.json)$

  # --- SECURITY: code (SAST) ---
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (scan custom_components/)
        args: ["-r", "custom_components", "-q", "-ll"]
        pass_filenames: false

  # --- Home Assistant specific validations ---
  - repo: local
    hooks:
      - id: ha-manifest-validation
        name: Validate Home Assistant manifest.json
        language: system
        entry: bash -c 'python -c "import json; json.load(open(\"custom_components/habragerone/manifest.json\"))"'
        files: ^custom_components/.*/manifest\.json$
        pass_filenames: false

      - id: ha-strings-validation
        name: Validate Home Assistant strings.json
        language: system
        entry: bash -c 'python -c "import json; json.load(open(\"custom_components/habragerone/strings.json\"))"'
        files: ^custom_components/.*/strings\.json$
        pass_filenames: false

  # --- Tests on pre-push: project 80% + patch 100% vs main (Codecov parity) ---
  - repo: local
    hooks:
      - id: pytest-pre-push
        name: pytest (coverage gates on push)
        language: system
        entry: bash scripts/check_patch_coverage.sh
        pass_filenames: false
        stages: [pre-push]
