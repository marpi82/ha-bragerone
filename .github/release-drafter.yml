# Release notes for GitHub Releases / HACS.
# Use Unicode emoji in titles (🚀), not :shortcodes: — shortcodes often render
# as literal text in GitHub Releases. Categories are exclusive (first match
# wins) so a PR with bug+testing+docs does not appear three times. See #374 / #376.
categories:
  - type: "pre-exclude"
    when:
      - label: "skip-changelog"
      - label: "duplicate"
      - label: "invalid"
      - label: "wontfix"
  - title: "💥 Breaking Changes"
    exclusive: true
    when:
      label: "breaking"
  - title: "🚀 Features"
    exclusive: true
    when:
      label: "enhancement"
  - title: "🔥 Removals and Deprecations"
    exclusive: true
    when:
      label: "removal"
  - title: "🐛 Fixes"
    exclusive: true
    when:
      label: "bug"
  - title: "⚡ Performance"
    exclusive: true
    when:
      label: "performance"
  - title: "📚 Documentation"
    exclusive: true
    when:
      label: "documentation"
  - title: "👷 Continuous Integration"
    exclusive: true
    collapse-after: 5
    when:
      label: "ci"
  - title: "📦 Dependencies"
    exclusive: true
    # Lock-file churn is excluded via skip-changelog on Renovate.
    collapse-after: 5
    when:
      labels:
        - "dependencies"
        - "build"
  - title: "🔨 Refactoring"
    exclusive: true
    when:
      label: "refactoring"
  - title: "🚨 Testing"
    exclusive: true
    collapse-after: 5
    when:
      label: "testing"
  - title: "💄 Style"
    exclusive: true
    when:
      label: "style"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
category-template: "### $TITLE"

# Strip recurring non-user-facing chore lines that still slip into the draft.
replacers:
  - search: '/^- chore: bump integration(?: version)? to .*\n/gm'
    replace: ""
  - search: '/^- chore\(release\): bump manifest to .*\n/gm'
    replace: ""
  - search: '/^- chore\(deps\): lock file maintenance.*\n/gm'
    replace: ""

template: |
  $CHANGES
