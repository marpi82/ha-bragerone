name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: dependency
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # GHSA-cfh3-3jmp-rvhc: existing allow.
          # GHSA-g6cj-pr64-35w5 / GHSA-jwv3-5hgf-82ww / GHSA-m2h6-j472-rp4c:
          # inherited from Home Assistant's cryptography==48.0.1 pin (fixed in 49+/50+).
          allow-ghsas: >
            GHSA-cfh3-3jmp-rvhc,
            GHSA-g6cj-pr64-35w5,
            GHSA-jwv3-5hgf-82ww,
            GHSA-m2h6-j472-rp4c

  quality:
    name: quality (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Checkout py-bragerone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: marpi82/py-bragerone
          ref: main
          path: py-bragerone

      - name: Link py-bragerone for uv editable source
        run: ln -sfn "$GITHUB_WORKSPACE/py-bragerone" "$GITHUB_WORKSPACE/../py-bragerone"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --group test

      - name: Ruff (lint)
        run: uv run --group dev ruff check .

      - name: Ruff (format)
        run: uv run --group dev ruff format --check

      - name: mypy (typecheck)
        run: uv run --group dev mypy

  security:
    name: security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Checkout py-bragerone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: marpi82/py-bragerone
          ref: main
          path: py-bragerone

      - name: Link py-bragerone for uv editable source
        run: ln -sfn "$GITHUB_WORKSPACE/py-bragerone" "$GITHUB_WORKSPACE/../py-bragerone"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --group test

      - name: Run Bandit
        run: uv run --group dev bandit -r custom_components -q -ll -f json -o bandit-report.json

      - name: Run pip-audit
        run: |
          uv run --group dev pip-audit \
            --format=json \
            --output=pip-audit-results.json \
            --progress-spinner=off \
            --skip-editable \
            --ignore-vuln PYSEC-2026-3552 \
            --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554

      - name: Upload security artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: security-results-${{ github.sha }}
          path: |
            bandit-report.json
            pip-audit-results.json
          retention-days: 30

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  validate-ha:
    name: validate-ha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate manifest.json
        run: |
          python -c "
          import json
          manifest = json.load(open('custom_components/habragerone/manifest.json'))
          required_keys = ['domain', 'name', 'version', 'documentation', 'issue_tracker', 'codeowners']
          missing = [key for key in required_keys if key not in manifest]
          if missing:
              raise ValueError(f'Missing required keys in manifest.json: {missing}')
          print('manifest.json is valid')
          "

      - name: Validate strings.json
        run: |
          python -c "
          import json
          json.load(open('custom_components/habragerone/strings.json'))
          print('strings.json is valid')
          "

  dependency-wheel-compat:
    name: dependency wheel compat (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - name: Export manifest requirements
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path

          manifest = Path("custom_components/habragerone/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          requirements = data.get("requirements", [])
          if not requirements:
              raise SystemExit("No requirements found in manifest.json")
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          requirements_file = runner_temp / "manifest-requirements.txt"
          requirements_file.write_text(
              "\n".join(requirements) + "\n", encoding="utf-8"
          )
          print(f"Requirements file: {requirements_file}")
          print("Requirements exported:")
          for requirement in requirements:
              print(f"- {requirement}")
          PY

      - name: Validate binary wheels
        run: |
          python -m pip install --upgrade pip
          # Include musllinux 1.2 and 1.1 tags to cover wheels built against both musl baselines.
          # Prefer musllinux (HAOS/Alpine); fall back to manylinux where musl
          # wheels are not yet published for CPython 3.14 (e.g. tree-sitter aarch64).
          python -m pip download \
            --dest "${RUNNER_TEMP}/wheels-${{ matrix.arch }}" \
            --requirement "${RUNNER_TEMP}/manifest-requirements.txt" \
            --only-binary=:all: \
            --platform musllinux_1_2_${{ matrix.arch }} \
            --platform musllinux_1_1_${{ matrix.arch }} \
            --platform manylinux2014_${{ matrix.arch }} \
            --platform manylinux_2_17_${{ matrix.arch }} \
            --platform manylinux_2_28_${{ matrix.arch }} \
            --implementation cp \
            --python-version 3.14.2

  tests:
    name: tests (3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Checkout py-bragerone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: marpi82/py-bragerone
          ref: main
          path: py-bragerone

      - name: Link py-bragerone for uv editable source
        run: ln -sfn "$GITHUB_WORKSPACE/py-bragerone" "$GITHUB_WORKSPACE/../py-bragerone"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --group test

      - name: Run pytest
        run: uv run --group test pytest -q --maxfail=1 --disable-warnings --cov=custom_components.habragerone --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports to Codecov
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: ha-bragerone
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [secrets, dependency-review, quality, security, hassfest, validate-ha, dependency-wheel-compat, tests]
    if: always() && needs.quality.result == 'success' && needs.hassfest.result == 'success' && needs.validate-ha.result == 'success' && needs.dependency-wheel-compat.result == 'success' && needs.tests.result == 'success' && needs.secrets.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Checkout py-bragerone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: marpi82/py-bragerone
          ref: main
          path: py-bragerone

      - name: Link py-bragerone for uv editable source
        run: ln -sfn "$GITHUB_WORKSPACE/py-bragerone" "$GITHUB_WORKSPACE/../py-bragerone"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Build package
        run: uv run --group dev hatch build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ github.sha }}
          path: dist/*
          retention-days: 7

  ci-gate:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [secrets, dependency-review, quality, security, hassfest, validate-ha, dependency-wheel-compat, tests, build]
    steps:
      - name: Verify all required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Only dependency-review may legitimately skip (push events); any other
          # non-success fails the gate so a misconfigured `if:` can't slip through.
          echo "$NEEDS" | jq -e '
            to_entries
            | map(select(
                if .key == "dependency-review"
                then (.value.result != "success" and .value.result != "skipped")
                else .value.result != "success" end))
            | if length == 0 then true
              else error("Failed jobs: " + (map(.key) | join(", "))) end' > /dev/null
          echo "All required jobs passed."
