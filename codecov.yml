coverage:
  status:
    patch:
      default:
        # Enforce 100% patch on PRs only. Push/merge commits on main often get a
        # wrong Codecov compare base (dozens of commits back), which fails patch
        # even when the PR was green and the merge only touched ignored files.
        target: 100%
        threshold: 0%
        only_pulls: true
    project:
      default:
        informational: true

ignore:
  - "tests/**/*"
  - "scripts/**/*"
  - "docs/**/*"
  - ".github/**"
  - "pyproject.toml"
  - "uv.lock"
  - "hacs.json"
  - "custom_components/habragerone/manifest.json"

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
